<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TahminBot</title>
<style>
  h1 {
    text-align: center;
    font-family:Arial, Helvetica, sans-serif;
    font-size: 5rem;
}
.itemler{
    display: flex;
    justify-content: center;

}
#giris{
    width: 10rem;
    height: 10rem;
    font-size: 5rem;
    background-color: #3F9AA5;
}
body{
    background-color:#03585D ;
    
 
}
#giris::-webkit-inner-spin-button {
appearance: none;
}
#giris::-webkit-outer-spin-button {
appearance: none;
}
#dugme{
width: 7rem;
height: 5rem;
background-color:#3F9AA5;
font-size: 2rem;
}
#sonuc{
    text-align: center;
    font-family:Arial, Helvetica, sans-serif;
    font-size: 5rem;
}
.newButtons{
    width: 7rem;
height: 5rem;
background-color:#3F9AA5;
font-size: 2rem;
 display: flex;
    justify-content: center;
}
</style>
</head>
<body>
  <h1>Yaşınızı Girin</h1>
  <div class="itemler"><input required min="1" max="120" id="giris" type="number"></div>
  <br>
  <br>
  <div class="itemler"><button onclick="tiklandi()" id="dugme">Tıkla...</button></div>
  <p id="sonuc"></p>
  <script>
  function tiklandi (){
    const yas = document.getElementById ("giris").value
    document.getElementById ("sonuc").innerHTML = "Yaklaşık 5 Saniye Bekleyiniz..."
    setTimeout(() => {
  document.getElementById ("sonuc").innerHTML = "Yaşınız " + yas + " Değil mi?"
}, (Math.floor(Math.random() * 8) + 3) * 1000 );
}</script>
</body>
</html>
